name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Docs and Kaggle metadata are up to date
        run: |
          python scripts/docs.py
          git diff --exit-code -- docs kaggle
      - name: Validate the sample
        run: python scripts/validate.py
